[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appclasificacion"
version = "0.1.0"
description = "Laboratorio acústico de vigas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "soundfile>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
